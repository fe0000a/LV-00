<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LV-00</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #2e2f31;
  color: #f4ede3;
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  line-height: 1.8;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* hide all scrollbars globally */
* {
  scrollbar-width: none;
}
*::-webkit-scrollbar {
  display: none;
}

.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  padding: 4rem 6rem;
  height: 100vh;
  overflow: hidden;
}
.screen.active { display: flex; }

/* ========== MENU ========== */
#screen-menu {
  justify-content: center;
  align-items: flex-start;
}
.menu-items { display: flex; flex-direction: column; gap: 1rem; }
.menu-item {
  cursor: pointer;
  letter-spacing: 0.1em;
  user-select: none;
  white-space: pre;
  padding: 0.25rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.menu-item.selected::before { content: '> '; }
.menu-item:not(.selected)::before { content: '  '; }

/* ========== READ SCREEN ========== */
#screen-read {
  justify-content: space-between;
}
.read-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2rem;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.read-body {
  flex: 1;
  overflow: hidden;
}
.read-chapter {
  letter-spacing: 0.15em;
  margin-bottom: 2rem;
}
.read-poem {
  line-height: 2.2;
  margin-bottom: 2rem;
  white-space: pre-wrap;
}
.read-task {
  line-height: 2;
  white-space: pre-wrap;
}
.read-nav {
  display: flex;
  justify-content: flex-end;
  gap: 2rem;
  margin-top: 2rem;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.read-nav .nav-btn {
  cursor: pointer;
  user-select: none;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.read-nav .nav-btn:hover { opacity: 0.7; }

/* ========== SELECT SCREEN ========== */
#screen-select {
  flex-direction: column;
}
#select-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
#select-list > div {
  padding: 0.5rem 0;
  min-height: 2.8rem;
  display: flex;
  align-items: center;
}

/* ========== SOLVE / LAB SCREEN ========== */
#screen-solve, #screen-lab {
  flex-direction: column;
}
.solve-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.editor-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
textarea.code-input {
  background: transparent;
  border: none;
  outline: none;
  color: #f4ede3;
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  line-height: 1.8;
  resize: none;
  flex: 1;
  min-height: 0;
  caret-color: #f4ede3;
  overflow-y: auto;
  padding: 0.5rem 0;
}
textarea.code-input::placeholder {
  color: #888;
  opacity: 0.6;
  font-family: 'Noto Serif JP', serif;
}
.run-btn {
  margin-top: 1.5rem;
  cursor: pointer;
  user-select: none;
  letter-spacing: 0.15em;
  width: fit-content;
  flex-shrink: 0;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.run-btn:hover { opacity: 0.7; }
.log-area {
  margin-top: 1.5rem;
  white-space: pre-wrap;
  line-height: 1.9;
  font-size: 16px;
  flex-shrink: 0;
  max-height: 30vh;
  overflow-y: auto;
}
.back-from-solve {
  cursor: pointer;
  user-select: none;
  margin-top: 1rem;
  width: fit-content;
  flex-shrink: 0;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.back-from-solve:hover { opacity: 0.7; }

#solve-chapter-label {
  cursor: pointer;
  user-select: none;
  padding: 0.25rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
#solve-chapter-label:hover { opacity: 0.7; }

/* ========== SAMPLES SCREEN ========== */
#screen-samples {
  flex-direction: column;
}
.samples-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.sample-tabs {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.sample-tab {
  cursor: pointer;
  user-select: none;
  white-space: pre;
  padding: 0.25rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.sample-tab.selected::before { content: '> '; }
.sample-tab:not(.selected)::before { content: '  '; }
.sample-code {
  white-space: pre;
  line-height: 1.9;
  font-size: 16px;
  flex: 1;
  overflow: auto;
  min-height: 0;
}
.sample-run-btn {
  margin-top: 1.5rem;
  cursor: pointer;
  user-select: none;
  letter-spacing: 0.15em;
  width: fit-content;
  flex-shrink: 0;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.sample-run-btn:hover { opacity: 0.7; }
.sample-log {
  margin-top: 1.5rem;
  white-space: pre-wrap;
  line-height: 1.9;
  font-size: 16px;
  flex-shrink: 0;
  max-height: 20vh;
  overflow: auto;
}
.back-btn {
  cursor: pointer;
  user-select: none;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.back-btn:hover { opacity: 0.7; }

/* ========== SETTINGS SCREEN ========== */
#screen-settings {
  justify-content: center;
  align-items: flex-start;
}
.settings-title {
  letter-spacing: 0.3em;
  margin-bottom: 3rem;
}
.settings-items {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}
.settings-row {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}
.settings-label {
  width: 7rem;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.vol-slider-wrap {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 160px;
  height: 2px;
  background: #f4ede3;
  outline: none;
  cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #f4ede3;
  cursor: pointer;
}
.vol-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #f4ede3;
  border: none;
  cursor: pointer;
}
.vol-value {
  width: 2.5rem;
  text-align: right;
  letter-spacing: 0.05em;
}
.settings-back {
  margin-top: 3rem;
  cursor: pointer;
  user-select: none;
  letter-spacing: 0.1em;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
}
.settings-back:hover { opacity: 0.7; }
.delete-save-btn {
  cursor: pointer;
  user-select: none;
  letter-spacing: 0.05em;
  opacity: 0.7;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: inline-flex;
  align-items: center;
}
.delete-save-btn:hover { opacity: 1; }
.fullscreen-btn {
  cursor: pointer;
  user-select: none;
  letter-spacing: 0.05em;
  opacity: 0.8;
  padding: 0.5rem 0;
  min-height: 2.5rem;
  display: inline-flex;
  align-items: center;
}
.fullscreen-btn:hover { opacity: 1; }

/* ========== スマホ向け調整 (フォントサイズはPCと同じに維持) ========== */
@media (max-width: 768px) {
  .screen {
    padding: 1.5rem 1.5rem;
  }
  #screen-menu {
    padding-top: 2rem;
  }
  .menu-items {
    gap: 0.75rem;
  }
  /* フォントサイズは継承 (16px) を維持 */
  .menu-item {
    min-height: 3rem;
  }
  .read-top {
    margin-bottom: 1.5rem;
  }
  .read-chapter {
    margin-bottom: 1.5rem;
  }
  .read-poem {
    margin-bottom: 1.5rem;
  }
  .read-nav {
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  .read-nav .nav-btn {
    min-height: 2.8rem;
  }
  #select-list > div {
    min-height: 3rem;
    padding: 0.25rem 0;
  }
  .solve-top {
    margin-bottom: 1rem;
  }
  textarea.code-input {
    padding: 0.25rem 0;
  }
  .run-btn {
    min-height: 3rem;
    margin-top: 1rem;
  }
  .log-area {
    max-height: 25vh;
    margin-top: 1rem;
  }
  .back-from-solve {
    min-height: 3rem;
  }
  #solve-chapter-label {
    min-height: 3rem;
  }
  .samples-top {
    margin-bottom: 1rem;
  }
  .sample-tabs {
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .sample-tab {
    min-height: 2.8rem;
  }
  .sample-run-btn {
    min-height: 3rem;
    margin-top: 1rem;
  }
  .sample-log {
    max-height: 15vh;
    margin-top: 1rem;
  }
  .back-btn {
    min-height: 3rem;
  }
  .settings-title {
    margin-bottom: 2rem;
  }
  .settings-row {
    gap: 1rem;
  }
  .settings-label {
    width: 6rem;
  }
  .vol-slider {
    width: 120px;
  }
  .vol-value {
    width: 2rem;
  }
  .settings-back {
    min-height: 3rem;
    margin-top: 2rem;
  }
  .delete-save-btn {
    min-height: 3rem;
  }
  .fullscreen-btn {
    min-height: 3rem;
  }
  #screen-menu > div:first-child {
    font-size: 1.2rem;
  }
  #screen-menu > div:nth-child(2) {
    margin-bottom: 3rem !important;
  }
}

@media (max-width: 480px) {
  .screen {
    padding: 1rem 1rem;
  }
  .menu-item {
    min-height: 2.8rem;
  }
  .read-nav {
    gap: 1rem;
  }
  #select-list > div {
    min-height: 2.8rem;
  }
  .vol-slider {
    width: 100px;
  }
  .settings-label {
    width: 5rem;
  }
}

<script>
// =============================================
//  LV-00 INTERPRETER  (rewritten)
// =============================================
class LV00Interpreter {
  constructor(sourceText) {
    this.sourceText = sourceText;
    this.regs  = Object.create(null);  // a-z → Number (float)
    this.arrs  = Object.create(null);  // name → Number[]
    this.soundLog = [];
    this.stdout = '';
    this.steps  = 0;
    this.MAX_STEPS = 2000000;
    this.stdinStr = '';
    this.stdinPos = 0;
  }

  setStdin(s) { this.stdinStr = s; this.stdinPos = 0; }

  // ── public entry ──────────────────────────
  run() {
    const stmts = this._parse(this.sourceText);
    this._execBlock(stmts);
    return { stdout: this.stdout, soundLog: this.soundLog };
  }

  // ── LEXER: produce flat token list ────────
  _lex(src) {
    const lines = src.split('\n');
    const tokens = [];
    for (let li = 0; li < lines.length; li++) {
      let line = lines[li];
      const ci = line.indexOf('//');
      if (ci >= 0) line = line.slice(0, ci);
      line = line.trim();
      if (!line) continue;
      tokens.push({ v: line, ln: li + 1 });
    }
    return tokens;
  }

  // ── PARSER ────────────────────────────────
  _parse(src) {
    const tokens = this._lex(src);
    const ctx = { tokens, pos: 0 };
    const stmts = [];
    while (ctx.pos < ctx.tokens.length) {
      stmts.push(this._parseStmt(ctx));
    }
    return stmts;
  }

  _parseStmt(ctx) {
    const tok = ctx.tokens[ctx.pos++];
    if (!tok) throw { code: 'SYNTAX', ln: 0 };
    const { v, ln } = tok;

    // bare closing brace — caller's parseBlock will handle
    if (v === '}') return { type: 'CLOSE', ln };

    // if <cond> { ...  }   or   if <cond> {
    if (/^if\s+/.test(v)) {
      let cond = v.slice(2).trim();
      let hasOpen = false;
      if (cond.endsWith('{')) { cond = cond.slice(0, -1).trim(); hasOpen = true; }
      const body = hasOpen ? this._parseBlock(ctx) : [this._parseStmt(ctx)];
      return { type: 'IF', cond, body, ln };
    }

    // loop <n> { ... }
    if (/^loop\s+/.test(v)) {
      let expr = v.slice(4).trim();
      let hasOpen = false;
      if (expr.endsWith('{')) { expr = expr.slice(0, -1).trim(); hasOpen = true; }
      const body = hasOpen ? this._parseBlock(ctx) : [this._parseStmt(ctx)];
      return { type: 'LOOP', expr, body, ln };
    }

    // while <cond> { ... }
    if (/^while\s+/.test(v)) {
      let cond = v.slice(5).trim();
      let hasOpen = false;
      if (cond.endsWith('{')) { cond = cond.slice(0, -1).trim(); hasOpen = true; }
      const body = hasOpen ? this._parseBlock(ctx) : [this._parseStmt(ctx)];
      return { type: 'WHILE', cond, body, ln };
    }

    // standalone {
    if (v === '{') {
      return { type: 'BLOCK', body: this._parseBlock(ctx), ln };
    }

    return { type: 'STMT', v, ln };
  }

  _parseBlock(ctx) {
    const body = [];
    while (ctx.pos < ctx.tokens.length) {
      const tok = ctx.tokens[ctx.pos];
      if (tok && tok.v === '}') { ctx.pos++; break; }
      const s = this._parseStmt(ctx);
      if (s.type === 'CLOSE') break;
      body.push(s);
    }
    return body;
  }

  // ── EXECUTOR ──────────────────────────────
  _execBlock(stmts) {
    for (const s of stmts) this._execStmt(s);
  }

  _execStmt(s) {
    this.steps++;
    if (this.steps > this.MAX_STEPS) throw { code: 'TIMEOUT' };
    switch (s.type) {
      case 'BLOCK': this._execBlock(s.body); break;
      case 'IF':
        if (this._eval(s.cond, s.ln) !== 0) this._execBlock(s.body);
        break;
      case 'LOOP': {
        const n = Math.trunc(this._eval(s.expr, s.ln));
        for (let i = 0; i < n; i++) this._execBlock(s.body);
        break;
      }
      case 'WHILE':
        while (this._eval(s.cond, s.ln) !== 0) {
          this.steps++;
          if (this.steps > this.MAX_STEPS) throw { code: 'TIMEOUT' };
          this._execBlock(s.body);
        }
        break;
      case 'STMT':
        this._execLine(s.v, s.ln);
        break;
    }
  }

  // ── LINE EXECUTOR (assignment or call) ────
  _execLine(line, ln) {
    // assignment: LHS = RHS
    // LHS can be: varname  or  varname[expr]
    const m = line.match(/^([a-z][a-z0-9]*)(\[[^\]]*\])?\s*=\s*(.+)$/);
    if (m) {
      const varName = m[1];
      if (varName.length > 1) throw { code: 'LONG_VAR', ln, varName };
      const idxExpr = m[2] ? m[2].slice(1, -1) : null;  // strip [ ]
      const rhs = m[3].trim();

      // special: in.str() returns an array
      if (rhs === 'in.str()') {
        if (idxExpr !== null) throw { code: 'SYNTAX', ln };
        this.arrs[varName] = this._readStr();
        return;
      }
      // special: self() returns an array
      if (rhs === 'self()') {
        if (idxExpr !== null) throw { code: 'SYNTAX', ln };
        this.arrs[varName] = this._selfArr();
        return;
      }

      const val = this._eval(rhs, ln);

      if (idxExpr !== null) {
        const idx = Math.trunc(this._eval(idxExpr, ln));
        if (idx < 0) throw { code: 'OUT_OF_BOUNDS', ln };
        if (!this.arrs[varName]) this.arrs[varName] = [];
        while (this.arrs[varName].length <= idx) this.arrs[varName].push(0);
        this.arrs[varName][idx] = val;
      } else {
        this.regs[varName] = val;
      }
      return;
    }
    // bare expression (side-effect calls like out.chr, sound)
    this._eval(line, ln);
  }

  // ── EXPRESSION EVALUATOR ──────────────────
  _eval(src, ln) {
    src = src.trim();
    try {
      const p = { src, pos: 0, ln };
      const v = this._parseCompare(p);
      this._ws(p);
      if (p.pos < p.src.length) {
        const ch = p.src[p.pos];
        if ('=&|^!~@#'.includes(ch)) throw { code: 'INVALID_OPERATOR', ln, op: ch };
        throw { code: 'SYNTAX', ln };
      }
      return v;
    } catch (e) {
      if (e && e.code) throw e;
      throw { code: 'SYNTAX', ln };
    }
  }

  _ws(p) {
    while (p.pos < p.src.length && p.src[p.pos] === ' ') p.pos++;
  }

  // comparison < addition
  _parseCompare(p) {
    let left = this._parseAdd(p);
    this._ws(p);
    for (const op of ['==','!=','<=','>=','<','>']) {
      if (p.src.startsWith(op, p.pos)) {
        p.pos += op.length; this._ws(p);
        const right = this._parseAdd(p);
        const r = op==='==' ? left===right : op==='!=' ? left!==right
                : op==='<'  ? left<right  : op==='>'  ? left>right
                : op==='<=' ? left<=right : left>=right;
        return r ? 1 : 0;
      }
    }
    return left;
  }

  _parseAdd(p) {
    let v = this._parseMul(p);
    this._ws(p);
    while (p.pos < p.src.length && (p.src[p.pos]==='+' || p.src[p.pos]==='-')) {
      const op = p.src[p.pos++]; this._ws(p);
      const r = this._parseMul(p);
      v = op==='+' ? v+r : v-r;
      this._ws(p);
    }
    return v;
  }

  _parseMul(p) {
    let v = this._parseUnary(p);
    this._ws(p);
    while (p.pos < p.src.length && (p.src[p.pos]==='*'||p.src[p.pos]==='/'||p.src[p.pos]==='%')) {
      const op = p.src[p.pos++]; this._ws(p);
      const r = this._parseUnary(p);
      if ((op==='/'||op==='%') && r===0) throw { code:'DIV_BY_ZERO', ln: p.ln };
      v = op==='*' ? v*r : op==='/' ? v/r : v%r;
      this._ws(p);
    }
    return v;
  }

  _parseUnary(p) {
    this._ws(p);
    if (p.src[p.pos]==='-') { p.pos++; return -this._parseAtom(p); }
    return this._parseAtom(p);
  }

  _parseAtom(p) {
    this._ws(p);
    const { src, ln } = p;

    // end of input with nothing to parse
    if (p.pos >= src.length) throw { code: 'UNEXPECTED_END', ln };

    // ( expr )
    if (src[p.pos]==='(') {
      p.pos++;
      const v = this._parseCompare(p);
      this._ws(p);
      if (p.pos >= src.length || src[p.pos]!==')') throw { code: 'UNCLOSED_PAREN', ln };
      p.pos++; return v;
    }

    // integer literal
    if (/[0-9]/.test(src[p.pos])) {
      let s='';
      while (p.pos<src.length && /[0-9]/.test(src[p.pos])) s+=src[p.pos++];
      return Number(s);
    }

    // builtins starting with keywords
    if (src.startsWith('in.num()', p.pos))  { p.pos+=8; return this._readNum(); }  // returns Number
    if (src.startsWith('in.str()', p.pos))  {
      p.pos+=8; this._readStr(); return 0;
    }
    if (src.startsWith('self()', p.pos))    { p.pos+=6; this._selfArr(); return 0; }

    if (src.startsWith('out.chr(', p.pos)) {
      p.pos+=8;
      const v=this._parseCompare(p); this._ws(p);
      if (src[p.pos]!==')') throw { code: 'UNCLOSED_PAREN', ln };
      p.pos++;
      this.stdout += String.fromCharCode(Math.trunc(v));
      return 0;
    }

    if (src.startsWith('out.num(', p.pos)) {
      p.pos+=8;
      const v=this._parseCompare(p); this._ws(p);
      if (src[p.pos]!==')') throw { code: 'UNCLOSED_PAREN', ln };
      p.pos++;
      this.stdout += Math.trunc(v).toString();
      return 0;
    }

    if (src.startsWith('sound(', p.pos)) {
      p.pos+=6;
      const freq=this._parseCompare(p); this._ws(p);
      if (src[p.pos]!==',') throw { code: 'MISSING_COMMA', ln, near: 'sound()' };
      p.pos++; this._ws(p);
      const ms=this._parseCompare(p); this._ws(p);
      if (src[p.pos]!==')') throw { code: 'UNCLOSED_PAREN', ln };
      p.pos++;
      this.soundLog.push({ freq: freq, ms: Math.trunc(ms) });
      return 0;
    }

    if (src.startsWith('len(', p.pos)) {
      p.pos+=4;
      let name='';
      while (p.pos<src.length && /[a-z0-9_]/.test(src[p.pos])) name+=src[p.pos++];
      this._ws(p);
      if (src[p.pos]!==')') throw { code: 'UNCLOSED_PAREN', ln };
      p.pos++;
      return (this.arrs[name]||[]).length;
    }

    // unknown builtin-like call (e.g. out.foo, in.foo)
    if (src.startsWith('out.', p.pos)) {
      const end = src.indexOf('(', p.pos);
      const name = end>=0 ? src.slice(p.pos, end) : src.slice(p.pos);
      throw { code: 'UNKNOWN_COMMAND', ln, name };
    }
    if (src.startsWith('in.', p.pos)) {
      const end = src.indexOf('(', p.pos);
      const name = end>=0 ? src.slice(p.pos, end) : src.slice(p.pos);
      throw { code: 'UNKNOWN_COMMAND', ln, name };
    }

    // identifier (variable or array access)
    if (/[a-z_]/.test(src[p.pos])) {
      let name='';
      while (p.pos<src.length && /[a-z0-9_]/.test(src[p.pos])) name+=src[p.pos++];
      if (name.length > 1 && !['in','out','self','len','sound'].some(k=>name.startsWith(k))) {
        throw { code: 'LONG_VAR', ln: p.ln, varName: name };
      }
      this._ws(p);
      if (src[p.pos]==='[') {
        p.pos++;
        const idx=this._parseCompare(p); this._ws(p);
        if (src[p.pos]!==']') throw { code: 'UNCLOSED_BRACKET', ln };
        p.pos++;
        const i=Math.trunc(idx);
        if (i<0) throw { code:'OUT_OF_BOUNDS', ln };
        return (this.arrs[name]||[])[i] ?? 0;
      }
      return this.regs[name] ?? 0;
    }

    // invalid operator or unknown character
    const ch = src[p.pos];
    if ('=&|^!~@#'.includes(ch)) throw { code: 'INVALID_OPERATOR', ln, op: ch };

    throw { code:'SYNTAX', ln };
  }

  // ── I/O helpers ───────────────────────────
  _readStr() {
    let buf='';
    while (this.stdinPos < this.stdinStr.length) {
      const ch = this.stdinStr[this.stdinPos++];
      if (ch==='\n') break;
      buf+=ch;
    }
    const arr=[];
    for (let i=0;i<buf.length;i++) arr.push(buf.charCodeAt(i));
    return arr;
  }

  _readNum() {
    const s = this.stdinStr;
    let i = this.stdinPos;
    // skip non-digit non-minus
    while (i<s.length && !/[0-9\-]/.test(s[i])) i++;
    let num='';
    if (i<s.length && s[i]==='-') num+=s[i++];
    while (i<s.length && /[0-9]/.test(s[i])) num+=s[i++];
    this.stdinPos=i;
    return num ? Number(num) : 0;
  }

  _selfArr() {
    const arr=[];
    for (let i=0;i<this.sourceText.length;i++) arr.push(this.sourceText.charCodeAt(i));
    return arr;
  }
}

// =============================================
//  RUNNER
// =============================================
function runCode(source, stdin) {
  const interp = new LV00Interpreter(source);
  interp.setStdin(stdin);
  try {
    const r = interp.run();
    return { ok:true, stdout:r.stdout, soundLog:r.soundLog, error:null };
  } catch(e) {
    let msg;
    if      (!e)               msg = 'ERR: RUNTIME';
    else if (e.code==='TIMEOUT')        msg = 'ERR: TIMEOUT';
    else if (e.code==='DIV_BY_ZERO')    msg = `ERR: DIV BY ZERO AT LINE ${e.ln}`;
    else if (e.code==='OUT_OF_BOUNDS')  msg = `ERR: OUT OF BOUNDS AT LINE ${e.ln}`;
    else if (e.code==='LONG_VAR')       msg = `ERR: VARIABLE NAME MUST BE ONE LETTER AT LINE ${e.ln} ("${e.varName}")`;
    else if (e.code==='UNCLOSED_PAREN') msg = `ERR: UNCLOSED PARENTHESIS AT LINE ${e.ln}`;
    else if (e.code==='UNCLOSED_BRACKET') msg = `ERR: UNCLOSED BRACKET AT LINE ${e.ln}`;
    else if (e.code==='MISSING_COMMA')  msg = `ERR: MISSING COMMA AT LINE ${e.ln} (in ${e.near})`;
    else if (e.code==='UNKNOWN_COMMAND')msg = `ERR: UNKNOWN COMMAND AT LINE ${e.ln} ("${e.name}")`;
    else if (e.code==='INVALID_OPERATOR') msg = `ERR: INVALID OPERATOR AT LINE ${e.ln} ("${e.op}")`;
    else if (e.code==='UNEXPECTED_END') msg = `ERR: UNEXPECTED END OF EXPRESSION AT LINE ${e.ln}`;
    else if (e.code==='SYNTAX')         msg = `ERR: SYNTAX AT LINE ${e.ln}`;
    else msg = 'ERR: RUNTIME';
    return { ok:false, stdout:'', soundLog:[], error:msg };
  }
}

// =============================================
//  SOUND PLAYER (Web Audio API)
// =============================================
let audioCtx = null;

function playSounds(soundLog) {
  if (!soundLog || soundLog.length === 0) return;
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  let delay = 0;
  for (const s of soundLog) {
    const freq = s.freq;
    const dur = s.ms;
    setTimeout(() => {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(audioCtx.currentTime + dur / 1000);
      } catch(e) { /* 無視 */ }
    }, delay);
    delay += dur + 50;
  }
}

out.chr(10)`
  },
  {
    name: '03_string',
    stdin: 'hello',
    code:
`s = in.str()
n = len(s)

out.num(n)
out.chr(10)

i = 0
while i < n {
    c = s[i]
    out.chr(c)
    out.chr(10)
    i = i + 1
}`
  },
  {
    name: '04_numbers',
    stdin: '3\n10\n20\n30',
    code:
`n = in.num()
s = 0

loop n {
    v = in.num()
    s = s + v
}

out.num(s)
out.chr(10)`
  },
  {
    name: '05_system',
    stdin: '',
    code:
`c = self()
n = len(c)

out.num(n)
out.chr(10)

sound(440, 200)
sound(880, 200)`
  }
];

// =============================================
//  AUDIO (BGM/SE)
// =============================================
const bgmAudio = new Audio('bgm.mp3');
bgmAudio.loop = true;
bgmAudio.volume = 0.5;

const seAudio = new Audio('se_select.mp3');
let seVolume = 0.8;

let bgmStarted = false;

function startBgm() {
  if (!bgmStarted) {
    bgmStarted = true;
    setTimeout(()=>{ bgmAudio.play().catch(()=>{}); }, 1000);
  }
}

function onFirstInteraction() {
  startBgm();
  document.removeEventListener('click', onFirstInteraction);
  document.removeEventListener('keydown', onFirstInteraction);
}
document.addEventListener('click', onFirstInteraction);
document.addEventListener('keydown', onFirstInteraction);

function playSe() {
  const s = seAudio.cloneNode();
  s.volume = seVolume;
  s.play().catch(()=>{});
}

// =============================================
//  UI
// =============================================
let currentScreen = 'menu';
let menuIdx  = 0;
let readPage = 0;
let solveIdx = 0;
let sampleIdx= 0;

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  currentScreen = name;
}

// ── MENU ─────────────────────────────────────
const menuItems = document.querySelectorAll('.menu-item');
function renderMenu(){
  menuItems.forEach((el,i)=>el.classList.toggle('selected',i===menuIdx));
}

document.addEventListener('keydown', e => {
  if (currentScreen==='menu') {
    if (e.key==='ArrowDown'||e.key==='j'){ menuIdx=(menuIdx+1)%5; renderMenu(); playSe(); }
    else if (e.key==='ArrowUp'||e.key==='k'){ menuIdx=(menuIdx+4)%5; renderMenu(); playSe(); }
    else if (e.key==='Enter'){ playSe(); menuActivate(); }
  }
  if (currentScreen==='read') {
    if (e.key==='ArrowRight'||e.key==='l') nextPage();
    else if (e.key==='ArrowLeft'||e.key==='h') prevPage();
    else if (e.key==='Escape'){ showScreen('menu'); renderMenu(); }
  }
});

menuItems.forEach((el,i)=>{
  el.addEventListener('click',()=>{
    if(menuIdx===i){ playSe(); menuActivate(); }
    else { menuIdx=i; renderMenu(); playSe(); }
  });
  el.addEventListener('touchstart', (e) => {}, { passive: true });
});

function menuActivate(){
  if(menuIdx===0){ readPage=0; renderReadPage(); showScreen('read'); }
  else if(menuIdx===1){ renderSelect(); showScreen('select'); }
  else if(menuIdx===2){ sampleIdx=0; renderSamples(); showScreen('samples'); }
  else if(menuIdx===3){ showScreen('lab'); }
  else { showScreen('settings'); }
}

// ── CLEAR STATE ──────────────────────────────
const CLEAR_KEY = 'lv00_cleared';
const CODE_KEY = 'lv00_cleared_code';

function loadCleared(){ try{ return JSON.parse(localStorage.getItem(CLEAR_KEY))||[]; }catch(e){ return []; } }
function saveCleared(arr){ localStorage.setItem(CLEAR_KEY, JSON.stringify(arr)); }
function markCleared(idx){ const a=loadCleared(); if(!a.includes(idx)){ a.push(idx); saveCleared(a); } }
function isCleared(idx){ return loadCleared().includes(idx); }

function loadClearedCode(){ try{ return JSON.parse(localStorage.getItem(CODE_KEY))||{}; }catch(e){ return {}; } }
function saveClearedCode(obj){ localStorage.setItem(CODE_KEY, JSON.stringify(obj)); }
function getClearedCode(idx){ const o=loadClearedCode(); return o[idx] || ''; }
function setClearedCode(idx, code){ const o=loadClearedCode(); o[idx]=code; saveClearedCode(o); }

function deleteAllSaveData(){
  if(confirm('セーブデータを削除します。よろしいですか？')){
    localStorage.removeItem(CLEAR_KEY);
    localStorage.removeItem(CODE_KEY);
    renderSelect();
    if(currentScreen==='solve'){
      document.getElementById('code-input').value = '';
    }
    playSe();
  }
}

function chapterLabel(i){ return (isCleared(i)?'✓ ':'  ')+PROBLEMS[i].chapter; }

// ── SELECT ───────────────────────────────────
function renderSelect(){
  const list=document.getElementById('select-list');
  list.innerHTML='';
  PROBLEMS.forEach((p,i)=>{
    const el=document.createElement('div');
    el.style.cssText='cursor:pointer;user-select:none;white-space:pre;margin-bottom:0.5rem;';
    el.textContent=chapterLabel(i);
    el.addEventListener('mouseenter',()=>{ el.textContent='> '+p.chapter; });
    el.addEventListener('mouseleave',()=>{ el.textContent=chapterLabel(i); });
    el.addEventListener('click',()=>{ playSe(); solveIdx=i; renderSolve(); showScreen('solve'); });
    el.addEventListener('touchstart', (e) => {}, { passive: true });
    list.appendChild(el);
  });
}
document.getElementById('select-back').addEventListener('click',()=>{ playSe(); showScreen('menu'); renderMenu(); });

// ── READ ─────────────────────────────────────
function renderReadPage(){
  const p=PROBLEMS[readPage];
  document.getElementById('read-page-num').textContent=`${readPage+1} / ${PROBLEMS.length}`;
  document.getElementById('read-chapter').textContent=(isCleared(readPage)?'✓ ':'')+p.chapter;
  document.getElementById('read-poem').textContent=p.poem;
  document.getElementById('read-task').textContent=p.task;
}
function nextPage(){ if(readPage < PROBLEMS.length-1){ readPage++; renderReadPage(); } }
function prevPage(){ if(readPage > 0){ readPage--; renderReadPage(); } }

let readReturnTo = 'menu';

document.getElementById('read-next').addEventListener('click',()=>{ playSe(); nextPage(); });
document.getElementById('read-prev').addEventListener('click',()=>{ playSe(); prevPage(); });
document.getElementById('read-back').addEventListener('click',()=>{
  playSe();
  if(readReturnTo==='solve'){ readReturnTo='menu'; renderSolve(); showScreen('solve'); }
  else { showScreen('menu'); renderMenu(); }
});
document.getElementById('read-solve').addEventListener('click',()=>{ playSe(); solveIdx=readPage; readReturnTo='menu'; renderSolve(); showScreen('solve'); });

// ── SOLVE ────────────────────────────────────
function renderSolve(){
  const label = PROBLEMS[solveIdx].chapter;
  document.getElementById('solve-chapter-label').textContent = label;

  const saved = getClearedCode(solveIdx);
  if(saved) {
    document.getElementById('code-input').value = saved;
  } else {
    document.getElementById('code-input').value = '';
  }
  document.getElementById('log-area').textContent = '';
  document.getElementById('log-back').style.display = 'none';
}

document.getElementById('solve-back').addEventListener('click',()=>{ playSe(); renderSelect(); showScreen('select'); });
document.getElementById('solve-chapter-label').addEventListener('click',()=>{ playSe(); readPage=solveIdx; readReturnTo='solve'; renderReadPage(); showScreen('read'); });
document.getElementById('run-btn').addEventListener('click',()=>{ playSe(); runProblem(); });

async function runProblem(){
  const source=document.getElementById('code-input').value;
  const logArea=document.getElementById('log-area');
  const logBack=document.getElementById('log-back');
  logArea.textContent='';
  logBack.style.display='none';

  const prob=PROBLEMS[solveIdx];

  function log(line){ logArea.textContent+=line+'\n'; }

  for(let i=0;i<prob.runs;i++){
    const tc = prob.genCase(source);
    const r=runCode(source, tc.input);

    if(!r.ok){
      log(`> ${String(i+1).padStart(2,'0')}: ${r.error}`);
      break;
    }

    playSounds(r.soundLog);

    const pass = prob.judge(r.stdout, tc.expected, tc, r.soundLog, source);

    if(pass){
      log(`> ${String(i+1).padStart(2,'0')}: PASS`);
    } else {
      log(`> ${String(i+1).padStart(2,'0')}: FAIL [CASE ${String(i+1).padStart(2,'0')}]`);
      let inDisp = tc.input.trim();
      if(solveIdx===5) inDisp='['+tc.arr.join(', ')+']';
      log(`  IN  : ${JSON.stringify(inDisp)}`);
      if(solveIdx===6 || solveIdx===12){
        log(`  WANT: sound() x${tc.expected.length} (correct frequencies)`);
        log(`  GOT : sound() x${r.soundLog.length}`);
      } else {
        const wantStr = Array.isArray(tc.expected) ? tc.expected.join('') : String(tc.expected);
        log(`  WANT: ${JSON.stringify(wantStr)}`);
        log(`  GOT : ${JSON.stringify(r.stdout.trim())}`);
      }
      break;
    }

    if(i===prob.runs-1){
      log('> SUCCESS');
      markCleared(solveIdx);
      setClearedCode(solveIdx, source);
      logBack.style.display='block';
      renderSelect();
    }
    await new Promise(res=>setTimeout(res,0));
  }
}

document.getElementById('log-back').addEventListener('click',()=>{ playSe(); showScreen('menu'); renderMenu(); });

// ── LAB ──────────────────────────────────────
document.getElementById('lab-back').addEventListener('click',()=>{ playSe(); showScreen('menu'); renderMenu(); });
document.getElementById('lab-run-btn').addEventListener('click',()=>{ playSe(); runLabCode(); });

function runLabCode(){
  const source = document.getElementById('lab-code-input').value;
  const logArea = document.getElementById('lab-log-area');
  logArea.textContent = '';

  const r = runCode(source, '');
  if(!r.ok){
    logArea.textContent = r.error;
  } else {
    let out = r.stdout;
    if(r.soundLog.length > 0){
      if(out && !out.endsWith('\n')) out += '\n';
      out += r.soundLog.map(l => `sound(${l.freq}, ${l.ms})`).join('\n');
    }
    logArea.textContent = out || '(no output)';
    playSounds(r.soundLog);
  }
}

// ── SAMPLES ──────────────────────────────────
function renderSamples(){
  const tabsEl=document.getElementById('sample-tabs');
  tabsEl.innerHTML='';
  SAMPLES.forEach((s,i)=>{
    const el=document.createElement('span');
    el.className='sample-tab'+(i===sampleIdx?' selected':'');
    el.textContent=s.name;
    el.addEventListener('click',()=>{ playSe(); sampleIdx=i; renderSamples(); });
    el.addEventListener('touchstart', (e) => {}, { passive: true });
    tabsEl.appendChild(el);
  });
  document.getElementById('sample-code-display').textContent=SAMPLES[sampleIdx].code;
  document.getElementById('sample-log').textContent='';
}

document.getElementById('samples-back').addEventListener('click',()=>{ playSe(); showScreen('menu'); renderMenu(); });

document.getElementById('sample-run-btn').addEventListener('click',()=>{ playSe();
  const s=SAMPLES[sampleIdx];
  const r=runCode(s.code, s.stdin);
  const logEl=document.getElementById('sample-log');
  if(!r.ok){
    logEl.textContent=r.error;
  } else {
    let out=r.stdout;
    if(r.soundLog.length>0){
      if(out && !out.endsWith('\n')) out+='\n';
      out+=r.soundLog.map(l=>`sound(${l.freq}, ${l.ms})`).join('\n');
    }
    logEl.textContent=out||'(no output)';
    playSounds(r.soundLog);
  }
});

// ── SETTINGS ─────────────────────────────────
document.getElementById('settings-back').addEventListener('click',()=>{ playSe(); showScreen('menu'); renderMenu(); });
document.getElementById('delete-save-btn').addEventListener('click',()=>{ deleteAllSaveData(); });

// 全画面表示ボタン
document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {});
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
});

const volBgmSlider = document.getElementById('vol-bgm');
const volBgmVal    = document.getElementById('vol-bgm-val');
const volSeSlider  = document.getElementById('vol-se');
const volSeVal     = document.getElementById('vol-se-val');

volBgmSlider.addEventListener('input', ()=>{
  const v = volBgmSlider.value;
  volBgmVal.textContent = v;
  bgmAudio.volume = v / 100;
});
volSeSlider.addEventListener('input', ()=>{
  const v = volSeSlider.value;
  volSeVal.textContent = v;
  seVolume = v / 100;
});
volSeSlider.addEventListener('change', ()=>{ playSe(); });

// ── INIT ─────────────────────────────────────
renderMenu();

document.querySelectorAll('.code-input').forEach(el => {
  el.addEventListener('keydown', function(e){
    if(e.key==='Tab'){
      e.preventDefault();
      const s=this.selectionStart, en=this.selectionEnd;
      this.value=this.value.substring(0,s)+'    '+this.value.substring(en);
      this.selectionStart=this.selectionEnd=s+4;
    }
  });
});
</script>
